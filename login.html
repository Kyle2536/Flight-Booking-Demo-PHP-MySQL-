<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Passenger Login</title>
</head>
<body>
    <h1>Passenger Login</h1>
    <form action="http://localhost/login.php" method="POST">
        <label for="passenger_id">Passenger ID:</label>
        <input type="text" id="passenger_id" name="passenger_id" required><br>

        <label for="id_password">Password:</label>
        <input type="password" id="id_password" name="id_password" required><br>

        <button type="submit">Log In</button>
    </form>

	<p>Don't have an account? Create one below:</p>
    	<p><a href="http://localhost/signup.php">Sign up</a></p>

</body>
</html>
